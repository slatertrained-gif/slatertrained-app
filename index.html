<style>
/* Layout: phone-first app shell. Header, scrolling main, bottom nav with a centre quick-log button; side rail on wide screens.
   Brand: "Edition 1" — one all-dark world, solid SlaterTrained orange, no see-through tints. */
:root {
  --bg: #0B0B0C;
  --card: #131315;
  --card-2: #18181B;
  --card-3: #202024;
  --line: #232327;
  --line-2: #34343A;
  --text: #F6F3EE;
  --muted: #A8A39B;
  --faint: #6F6C67;
  --orange: #EE7A34;
  --orange-hi: #F4955A;
  --orange-lo: #C9601F;
  --ember: #2A190F;      /* solid dark orange for fills */
  --ember-2: #3B2213;
  --on-orange: #0B0B0C;
  --good: #5CC37E;
  --good-deep: #12261A;
  --warn: #EDB740;
  --warn-deep: #2B2310;
  --bad: #EC5F55;
  --bad-deep: #2E1513;
  --display: 'Syne', 'Arial Black', Impact, sans-serif;
  --nums: 'Archivo', 'Arial Narrow', sans-serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 18px;
  --r-sm: 12px;
  --shadow: 0 1px 0 #1D1D21 inset, 0 12px 28px #050506;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--orange); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.08; text-wrap: balance; letter-spacing: 0.2px; }
h1 { font-size: clamp(27px, 6.4vw, 36px); }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
summary::-webkit-details-marker { display: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- shell ---------- */
.shell { min-height: 100%; display: flex; }
.rail { display: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; min-height: 62px;
}
.topbar .grow { flex: 1; min-width: 0; }
.topbar .ctx { font-size: 11px; color: var(--orange); text-transform: uppercase; letter-spacing: 1.8px; font-weight: 700; }
.topbar .ttl { font-family: var(--display); font-weight: 800; font-size: 17px; }
.content {
  flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding-block: 20px 128px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; animation: rise .28s ease-out;
}
@keyframes rise { from { transform: translateY(6px); opacity: .55; } to { transform: none; opacity: 1; } }
.viewas { background: var(--orange); color: var(--on-orange); font-weight: 700; font-size: 13px; padding: 7px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.viewas button { background: var(--on-orange); color: var(--orange); border: 0; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 12px; }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; align-items: flex-end;
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.navbtn { background: none; border: 0; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; letter-spacing: .3px; padding: 6px 4px; min-width: 56px; position: relative; }
.navbtn svg { width: 22px; height: 22px; }
.navbtn.on { color: var(--orange); }
.navbtn .dot { position: absolute; top: 3px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
.fab { width: 58px; height: 58px; border-radius: 50%; border: 4px solid var(--card); background: linear-gradient(180deg, var(--orange-hi), var(--orange)); color: var(--on-orange); display: flex; align-items: center; justify-content: center; margin-top: -26px; flex: none; }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.95); }
@media (min-width: 900px) {
  .bottomnav { display: none; }
  .rail { display: flex; flex-direction: column; gap: 3px; width: 248px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--card); border-right: 1px solid var(--line); padding: 20px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); }
  .rail .navbtn { flex-direction: row; gap: 12px; font-size: 14px; padding: 10px 12px; border-radius: var(--r-sm); justify-content: flex-start; width: 100%; }
  .rail .navbtn.on { background: var(--ember); }
  .rail .navbtn .dot { position: static; margin-left: auto; }
  .rail .brand { padding: 0 6px 18px; display: flex; justify-content: center; }
  .content { padding-block: 28px 64px; }
  .topbar .mlogo { display: none; }
}

/* ---------- brand ---------- */
.logo-img { display: block; width: auto; }
.st-mark { font-family: var(--display); font-weight: 800; letter-spacing: 3.5px; font-size: 11px; color: var(--faint); }
.st-mark b { color: var(--orange); font-weight: 800; }
.footer { display: flex; justify-content: center; align-items: center; gap: 12px; padding-top: 14px; }
.footer i { height: 1px; width: 34px; background: var(--line-2); }

/* ---------- building blocks ---------- */
.eyebrow { font-size: 12px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
.eyebrow.ruled::before { content: ""; width: 26px; height: 2px; background: var(--orange); flex: none; }
.sub { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 7px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.row.nowrap { flex-wrap: nowrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.grid-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 350px), 1fr)); align-items: start; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 148px), 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 13px; min-width: 0; box-shadow: var(--shadow); }
.card.stripe { border-left: 4px solid var(--orange); }
.card.flat { background: var(--card-2); box-shadow: none; }
.card.hot { background: var(--ember); border-color: var(--orange); }
.card.hero { background: linear-gradient(160deg, var(--ember-2) 0%, var(--ember) 34%, var(--card) 78%); border-color: var(--line-2); }
.card.tap { cursor: pointer; transition: border-color .15s, transform .1s; text-align: left; color: var(--text); width: 100%; }
.card.tap:hover { border-color: var(--line-2); }
.card.tap:active { transform: scale(.992); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow); min-width: 0; }
.tile .big { font-family: var(--display); font-weight: 800; font-size: 31px; color: var(--orange); line-height: 1.05; }
.tile .big small { font-size: 14px; color: var(--muted); font-family: var(--body); font-weight: 500; }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.callout { border: 1.5px solid var(--orange); background: var(--ember); border-radius: var(--r); padding: 15px 17px; display: flex; flex-direction: column; gap: 7px; }
.divider { height: 1px; background: var(--line); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(180deg, var(--orange-hi), var(--orange)); color: var(--on-orange); border: 0; border-radius: 13px; padding: 12px 18px; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform .1s; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--line-2); }
.btn.ghost:hover { border-color: var(--orange); }
.btn.danger { background: var(--bad-deep); color: var(--bad); border: 1px solid var(--bad); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.iconbtn { background: var(--card-2); border: 1px solid var(--line-2); color: var(--text); width: 38px; height: 38px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.sm { width: 32px; height: 32px; border-radius: 9px; }
.iconbtn.or { background: var(--ember); border-color: var(--orange); color: var(--orange); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-deep); color: var(--good); }
.pill.warn { background: var(--warn-deep); color: var(--warn); }
.pill.bad { background: var(--bad-deep); color: var(--bad); }
.pill.or { background: var(--ember); color: var(--orange); }
.pill.mute { background: var(--card-2); color: var(--muted); border: 1px solid var(--line-2); }
.pill.solid { background: var(--orange); color: var(--on-orange); }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
.in { width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 11px; padding: 11px 12px; font-size: 16px; color: var(--text); outline: none; min-width: 0; }
textarea.in { min-height: 84px; resize: vertical; }
.in:focus { border-color: var(--orange); }
.in.sm { padding: 8px 10px; font-size: 15px; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: var(--card); border: 1px solid var(--line); color: var(--muted); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.tab.on { background: var(--orange); color: var(--on-orange); border-color: var(--orange); }
.seg { display: inline-flex; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 3px; }
.seg button { background: none; border: 0; padding: 7px 13px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--orange); color: var(--on-orange); }
input.sc { position: absolute; opacity: 0; pointer-events: none; }
input.sc:checked + .tab { background: var(--orange); color: var(--on-orange); border-color: var(--orange); }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li.tap { cursor: pointer; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--ember); color: var(--orange); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 14px; flex: none; border: 1.5px solid var(--orange); }
.avatar.lg { width: 56px; height: 56px; font-size: 19px; }
.avatar.coach { background: var(--orange); color: var(--on-orange); }

.bar { height: 8px; background: var(--card-3); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--orange-lo), var(--orange)); border-radius: 999px; }
.bar.good > i { background: var(--good); }

.check { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card-2); border: 1px solid var(--line); border-radius: 13px; text-align: left; width: 100%; color: var(--text); }
.check .box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line-2); flex: none; display: flex; align-items: center; justify-content: center; }
.check.on { border-color: var(--orange); background: var(--ember); }
.check.on .box { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
.check .box svg { width: 15px; height: 15px; }

.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }

/* rings + charts */
.ring { position: relative; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1; }
.ring .mid b { font-family: var(--display); font-weight: 800; }
.ring .mid span { font-size: 11px; color: var(--muted); }
.rings { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.rings .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; min-width: 200px; }
.rings .mini { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chartbox svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.spark { width: 72px; height: 26px; flex: none; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 4px 0; }
.cal button { background: var(--card-2); border: 1px solid var(--line); border-radius: 11px; min-height: 52px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text); font-weight: 500; font-size: 13px; }
.cal button.out { visibility: hidden; }
.cal button.today { border-color: var(--orange); }
.cal button.sel { background: var(--ember); border-color: var(--orange); }
.cal .dots { display: flex; gap: 3px; min-height: 6px; }
.cal .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
.cal .dots i.g { background: var(--good); }
.cal .dots i.w { background: var(--text); }
.cal .dots i.o { background: none; border: 1.5px solid var(--orange); }

/* set logger */
.setrow { display: grid; grid-template-columns: 30px 1fr 1fr 46px; gap: 8px; align-items: center; }
.setrow .sn { font-weight: 700; color: var(--muted); text-align: center; }
.setrow .done { width: 46px; height: 42px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--muted); display: flex; align-items: center; justify-content: center; }
.setrow .done.on { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
.setrow .done svg { width: 18px; height: 18px; }
.sslabel { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--on-orange); background: var(--orange); border-radius: 6px; padding: 2px 8px; align-self: flex-start; }
.timerbar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 40; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--orange); color: var(--on-orange); border-radius: 999px; padding: 10px 14px 10px 20px; display: flex; align-items: center; gap: 12px; font-weight: 700; box-shadow: 0 10px 30px #000; white-space: nowrap; }
.timerbar .t { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.timerbar button { background: var(--on-orange); color: var(--orange); border: 0; border-radius: 999px; padding: 6px 12px; font-weight: 700; }
@media (min-width: 900px) { .timerbar { bottom: 24px; } }

/* chat + feed */
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--orange); color: var(--on-orange); border-bottom-right-radius: 5px; }
.msg.them { align-self: flex-start; background: var(--card-2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg .ts { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
.composer { position: sticky; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 8px; }
@media (min-width: 900px) { .composer { bottom: 0; } }
.post { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.post:first-child { border-top: 0; }
.like { background: none; border: 0; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 13px; padding: 4px 0; }
.like svg { width: 16px; height: 16px; }
.like.on { color: var(--orange); }

/* entry */
.entry { min-height: 100%; display: flex; align-items: center; justify-content: center; padding-block: 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; overflow: hidden; }
.glow { position: absolute; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, #B5551D 0%, #6B3210 26%, #2F170A 50%, #0B0B0C 70%); top: -60px; left: 50%; transform: translateX(-50%); pointer-events: none; }
.entry .inner { position: relative; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px; align-items: stretch; }
.entry .brandbig { display: flex; justify-content: center; }
.entry .tag { text-align: center; color: var(--muted); font-size: 16px; }
.entry .eyebrow { justify-content: center; }
.entry .eyebrow::before, .entry .eyebrow::after { content: ""; width: 28px; height: 2px; background: var(--orange); }

.rankbadge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--orange); }
.rankbadge svg { width: 18px; height: 18px; }
.badges { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.badge { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: 12px; font-weight: 700; color: var(--faint); }
.badge .medal { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card-3); color: var(--faint); }
.badge .medal svg { width: 22px; height: 22px; }
.badge.on { color: var(--text); border-color: var(--orange); background: var(--ember); }
.badge.on .medal { background: linear-gradient(180deg, var(--orange-hi), var(--orange-lo)); color: var(--on-orange); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 60; background: #050506; opacity: .78; }
.sheet { position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--card); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); align-self: center; flex: none; }
@keyframes up { from { transform: translateY(48px); } to { transform: none; } }
@media (min-width: 700px) { .sheet { left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%); width: 520px; border-radius: 22px; border-bottom: 1px solid var(--line-2); animation: none; } .sheet .grab { display: none; } }
.qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qa button { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text); }
.qa button svg { width: 24px; height: 24px; color: var(--orange); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 100; background: var(--card-3); border: 1px solid var(--orange); color: var(--text); padding: 12px 18px; border-radius: 13px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 10px 30px #000; text-align: center; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.photo-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.photo-grid figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.photo-grid img, .compare img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); display: block; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.hide-sm { display: none; }
@media (min-width: 600px) { .hide-sm { display: initial; } }
.water { display: flex; gap: 5px; flex-wrap: wrap; }
.water i { width: 20px; height: 28px; border-radius: 4px 4px 8px 8px; border: 1.5px solid var(--line-2); background: var(--card-2); }
.water i.on { background: var(--orange); border-color: var(--orange); }

/* ---------- v3: login, targets, thumbs, summary ---------- */
.entry { align-items: stretch; padding-block: 0; overflow: visible; }
.ent { width: 100%; max-width: 1080px; margin: 0 auto; display: grid; gap: 22px; align-content: center; padding-block: 26px; }
.ent-brand { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
.ent-brand > *:not(.glow) { position: relative; }
.ent-brand .glow { top: -110px; width: 620px; height: 620px; }
.ent-brand h1 { font-size: clamp(30px, 7.4vw, 52px); }
.ent-brand .tag { max-width: 400px; }
.ent-logo { animation: logoin .7s cubic-bezier(.2, .8, .2, 1); }
.ent-logo .logo-img { height: clamp(170px, 30vh, 250px) !important; }
@keyframes logoin { from { transform: translateY(14px) scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.ent-points { list-style: none; margin: 4px 0 0; padding: 0; display: none; flex-direction: column; gap: 10px; text-align: left; }
.ent-points li { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
.ent-points svg { width: 22px; height: 22px; padding: 4px; border-radius: 50%; background: var(--orange); color: var(--on-orange); flex: none; }
.ent-side { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 440px; margin: 0 auto; }
.ent-card { position: relative; overflow: hidden; padding-top: 26px; gap: 16px; }
.hazard { position: absolute; inset: 0 0 auto 0; height: 7px; background: repeating-linear-gradient(-45deg, var(--orange) 0 12px, var(--bg) 12px 24px); }
.entrow { background: none; border: 0; border-top: 1px solid var(--line); width: 100%; text-align: left; color: var(--text); }
.entrow:first-child { border-top: 0; }
.pindots { display: flex; gap: 14px; }
.pindots i { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line-2); }
.pindots i.on { background: var(--orange); border-color: var(--orange); }
.pindots.bad { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; justify-content: center; }
.keypad button { height: 62px; border-radius: 18px; background: var(--card-2); border: 1px solid var(--line-2); font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--text); display: flex; align-items: center; justify-content: center; }
.keypad button:active { background: var(--orange); color: var(--on-orange); border-color: var(--orange); }
.keypad button svg { width: 22px; height: 22px; }
@media (min-width: 900px) {
  .ent { grid-template-columns: 1.1fr .9fr; align-items: center; gap: 56px; }
  .ent-brand { align-items: flex-start; text-align: left; }
  .ent-brand .glow { left: 30%; }
  .ent-brand .eyebrow { justify-content: flex-start; }
  .entry .ent-brand .eyebrow::after { display: none; }
  .ent-points { display: flex; }

/* ---------- macro calculator (starting targets) ---------- */
function calcMacros({ sex = 'm', age, height, weight, trade, goal }) {
  const bmr = 10 * weight + 6.25 * height - 5 * age + (sex === 'f' ? -161 : 5);
  const mult = (TRADES.find(t => t.name === trade) || TRADES[0]).mult;
  const adj = (GOALS.find(g => g.id === goal) || GOALS[1]).adj;
  const build = kcal => { kcal = r5(kcal * (1 + adj)); const p = Math.round(weight * (goal === 'cut' ? 2.2 : 2.0)); const f = Math.round(kcal * 0.25 / 9); const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4)); return { kcal, p, c, f }; };
  return { site: build(bmr * mult), rest: build(bmr * 1.35), bmr: Math.round(bmr) };
}

const DB = {

/* ---------- nutrition ---------- */
function dayTotals(id, date) { const f = DB.foodOn(id, date); return { kcal: Math.round(sum(f, x => x.kcal * x.qty)), p: Math.round(sum(f, x => x.p * x.qty)), c: Math.round(sum(f, x => x.c * x.qty)), f: Math.round(sum(f, x => x.f * x.qty)), n: f.length }; }
function targetsFor(c, date) { const d = DB.day(c.id, date); const site = d ? d.siteDay : (dow(date) > 0 && dow(date) < 6); return { ...(site ? c.targets.site : c.targets.rest), site }; }

/* ---------- points, ranks, streaks ---------- */
function points(id, since = null) {
  const ok = d => !since || d >= since, c = DB.client(id);
  let p = S.logs.filter(l => l.clientId === id && ok(l.date)).length * POINTS.session;
  p += S.checkins.filter(x => x.clientId === id && ok(x.date)).length * POINTS.checkin;
  p += S.cardio.filter(x => x.clientId === id && ok(x.date)).length * POINTS.cardio;
  const foodDays = new Set(S.food.filter(f => f.clientId === id && ok(f.date)).map(f => f.date));
  S.daily.filter(d => d.clientId === id && ok(d.date)).forEach(d => {
    if (d.weight || foodDays.has(d.date)) p += POINTS.logDay;
    if (c && habitsOn(c, d.date).length && habitsOn(c, d.date).every(h => d.habits.includes(h.id))) p += POINTS.habitsDay;
  });
  return p;
}
function rankOf(pts) { let i = 0; RANKS.forEach((r, k) => { if (pts >= r.min) i = k; }); const next = RANKS[i + 1]; return { i, rank: RANKS[i], next, pct: next ? Math.round((pts - RANKS[i].min) / (next.min - RANKS[i].min) * 100) : 100 }; }
function activeDates(id) { const s = new Set(); S.logs.forEach(l => l.clientId === id && s.add(l.date)); S.cardio.forEach(l => l.clientId === id && s.add(l.date)); S.daily.forEach(d => d.clientId === id && (d.habits.length || d.weight) && s.add(d.date)); S.food.forEach(f => f.clientId === id && s.add(f.date)); return s; }
function streaks(id) {
  const s = activeDates(id); let cur = 0, dt = today(); if (!s.has(dt)) dt = addDays(dt, -1); while (s.has(dt)) { cur++; dt = addDays(dt, -1); }
  let best = 0, run = 0, prev = null; [...s].sort().forEach(d => { run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  return { cur, best };
}
function lastActive(id) { const a = [...activeDates(id)].sort().pop(), k = DB.checkinsOf(id)[0]?.date; return [a, k].filter(Boolean).sort().pop() || null; }
function checkinDue(id) { const k = DB.checkinsOf(id)[0]; return !k || k.date < mondayOf(today()); }
function planEnd(c) { return addMonths(c.start, DB.plan(c).months); }
function weekNo(c) { return Math.max(1, Math.floor(daysBetween(c.start, today()) / 7) + 1); }
function status(c) {
  if (c.status !== 'active') return { k: 'mute', t: c.status === 'paused' ? 'Paused' : 'Finished' };
  const la = lastActive(c.id), q = la ? daysBetween(la, today()) : 99;
  if (q >= 4) return { k: 'bad', t: 'Quiet ' + (la ? q + 'd' : '') };
  if (S.checkins.some(k => k.clientId === c.id && !k.reviewed)) return { k: 'warn', t: 'Check-in to review' };
  return { k: 'good', t: 'On track' };
}

/* ---------- training ---------- */
function todaysPlan(c, date = today()) {
  const p = DB.prog(c.programmeId); if (!p || !p.days.length) return { p: null, day: null, rest: false };
  const sched = p.days.filter(d => d.weekday != null && d.weekday !== '');
  if (sched.length) { const day = sched.find(d => +d.weekday === dow(date)); if (day) return { p, day, rest: false }; const nx = Array.from({ length: 7 }, (_, i) => addDays(date, i + 1)).map(dt => sched.find(d => +d.weekday === dow(dt))).find(Boolean); return { p, day: null, rest: true, next: nx }; }
  const last = DB.logsOf(c.id).find(l => l.progId === p.id); const i = last ? p.days.findIndex(d => d.id === last.dayId) : -1;
  return { p, day: p.days[(i + 1) % p.days.length], rest: false };
}
function lastSetsFor(clientId, exId) { const log = DB.logsOf(clientId).find(l => l.sets.some(s => s.exId === exId)); return log ? log.sets.filter(s => s.exId === exId) : []; }
const e1rm = s => (s.kg || 0) * (1 + (s.reps || 0) / 30);
function bestLifts(id) { const prs = {}; DB.logsOf(id).forEach(l => l.sets.forEach(s => { const e = e1rm(s); if (e > 0 && (!prs[s.exId] || e > prs[s.exId].e1)) prs[s.exId] = { e1: e, kg: s.kg, reps: s.reps, date: l.date }; })); return prs; }
function liftHistory(id, exId) { return DB.logsOf(id).filter(l => l.sets.some(s => s.exId === exId)).map(l => { const ss = l.sets.filter(s => s.exId === exId); return { date: l.date, sets: ss, top: Math.max(...ss.map(e1rm)), vol: sum(ss, s => s.kg * s.reps) }; }).reverse(); }
function compliance(c, days = 7) {
  const since = addDays(today(), -days + 1), p = DB.prog(c.programmeId), planned = p ? Math.max(1, Math.round(p.days.length * days / 7)) : 0;
  const done = S.logs.filter(l => l.clientId === c.id && l.date >= since).length;
  const dl = S.daily.filter(d => d.clientId === c.id && d.date >= since);
  const hx = habitSlots(c, since, days), habits = hx ? Math.min(1, sum(dl, d => d.habits.length) / hx) : 0;
  const foodDays = new Set(S.food.filter(f => f.clientId === c.id && f.date >= since).map(f => f.date)).size / days;
  const train = planned ? Math.min(1, done / planned) : 0;
  return { train: Math.round(train * 100), habits: Math.round(habits * 100), food: Math.round(foodDays * 100), all: Math.round((train + habits + foodDays) / 3 * 100), done, planned };
}

/* ---------- bodyweight ---------- */
function weightData(c, days = 0) {
  const all = DB.dailyOf(c.id).filter(d => d.weight).map(d => ({ x: d.date, y: d.weight }));
  let t = null; const trend = all.map(p => { t = t == null ? p.y : t + 0.22 * (p.y - t); return { x: p.x, y: t }; });   // smoothed trend line
  const since = days ? addDays(today(), -days) : '0'; const raw = all.filter(p => p.x >= since), tr = trend.filter(p => p.x >= since);
  if (tr.length < 2) return { raw, trend: tr, n: raw.length };
  const cur = tr[tr.length - 1].y, startY = tr[0].y;
  // rate: least-squares slope of the trend over the last 21 days
  const rs = trend.filter(p => p.x >= addDays(today(), -21)); let rate = 0;
  if (rs.length > 2) { const xs = rs.map(p => daysBetween(rs[0].x, p.x)), mx = sum(xs) / xs.length, my = sum(rs, p => p.y) / rs.length; const den = sum(xs, x => (x - mx) ** 2); rate = den ? sum(xs.map((x, i) => (x - mx) * (rs[i].y - my))) / den * 7 : 0; }
  let eta = null; const g = c.goalWeight;
  if (g && Math.abs(rate) > 0.02 && Math.sign(g - cur) === Math.sign(rate)) { const d = Math.round((g - cur) / rate * 7); if (d > 0 && d < 730) eta = addDays(today(), d); }
  const wk = {}; all.forEach(p => { const m = mondayOf(p.x); (wk[m] = wk[m] || []).push(p.y); });
  const weeks = Object.entries(wk).sort().map(([m, v]) => ({ week: m, avg: sum(v) / v.length, n: v.length }));
  const first0 = all[0].y;
  return { raw, trend: tr, n: raw.length, cur, change: cur - startY, total: cur - first0, rate, eta, lo: Math.min(...raw.map(p => p.y)), hi: Math.max(...raw.map(p => p.y)), weeks, toGoal: g ? g - cur : null, startAll: first0 };
}

/* ---------- badges ---------- */
function badgeStats(c) {

  return { sessions: logs.length, bestStreak: streaks(c.id).best, checkins: DB.checkinsOf(c.id).length, prs: sum(logs, l => (l.prs || []).length), moved: w.n > 1 ? Math.abs(w.total) : 0,
    goalHit: !!(c.goalWeight && w.n > 1 && (w.startAll > c.goalWeight ? w.cur <= c.goalWeight : w.cur >= c.goalWeight)), photos: DB.photosOf(c.id).length, points: points(c.id) };
}
function badgesOf(c) { const st = badgeStats(c); return BADGES.map(b => ({ ...b, on: b.test(st) })); }

/* ---------- billing ---------- */
function billing(c) {
  const pl = DB.plan(c), total = c.price != null && c.price !== '' ? +c.price : pl.price + (c.addon ? (pl.addon || 0) : 0);
  const n = c.billing === 'Monthly' ? pl.months : c.billing === 'Weekly' ? Math.round(pl.months * 52 / 12) : 1, each = total / n;
  const pays = S.payments.filter(p => p.clientId === c.id).sort((a, b) => a.date.localeCompare(b.date)), paid = sum(pays, p => p.amount);
  const k = Math.min(n, Math.floor(paid / each + 0.01));
  const nextDue = paid >= total - 0.5 ? null : c.billing === 'Monthly' ? addMonths(c.start, k) : c.billing === 'Weekly' ? addDays(c.start, k * 7) : c.start;
  const overdue = !!nextDue && nextDue < today() && c.status === 'active';
  return { total, each, n, paid, left: Math.max(0, total - paid), nextDue, overdue, pays, monthly: c.billing === 'Monthly' ? each : c.billing === 'Weekly' ? each * 52 / 12 : 0 };
}

/* ---------- calendar ---------- */
function eventsOn(c, date) {
  const ev = [];
  S.logs.filter(l => l.clientId === c.id && l.date === date).forEach(l => ev.push({ k: 'done', icon: 'train', t: l.dayName, s: 'Session logged' + (l.duration ? ` · ${l.duration} min` : '') }));
  if (date >= today() && !ev.length) { const pl = todaysPlan(c, date); if (pl.day && pl.p.days.some(d => d.weekday != null && d.weekday !== '')) ev.push({ k: 'plan', icon: 'train', t: pl.day.name, s: 'Scheduled session' }); }
  S.cardio.filter(l => l.clientId === c.id && l.date === date).forEach(l => ev.push({ k: 'done', icon: 'run', t: l.type, s: `${l.mins} min${l.km ? ' · ' + l.km + ' km' : ''}` }));
  S.checkins.filter(l => l.clientId === c.id && l.date === date).forEach(() => ev.push({ k: 'good', icon: 'clip', t: 'Check-in', s: 'Submitted' }));
  if (dow(date) === 1 && date >= today() && !S.checkins.some(l => l.clientId === c.id && l.date >= date)) ev.push({ k: 'plan', icon: 'clip', t: 'Monday check-in', s: 'Due' });
  S.appts.filter(a => a.clientId === c.id && a.date === date && a.status !== 'cancelled').forEach(a => ev.push({ k: 'good', icon: 'cal', t: a.type, s: a.time + (a.status === 'requested' ? ' · requested' : '') }));
  const d = DB.day(c.id, date); if (d?.weight) ev.push({ k: 'w', icon: 'scale', t: 'Weigh-in', s: `${kgTo(d.weight, c.units)} ${c.units}` });
  if (S.photos.some(p => p.clientId === c.id && p.date === date)) ev.push({ k: 'w', icon: 'cam', t: 'Progress photos', s: 'Added' });
  if (S.measures.some(p => p.clientId === c.id && p.date === date)) ev.push({ k: 'w', icon: 'ruler', t: 'Measurements', s: 'Logged' });
  return ev;
}

/* ---------- automations ---------- */
function autoSend(c, id, vars = {}, key = null) {
  const a = S.settings.auto[id]; if (!a || !a.on) return false;
  key = key || `${id}:${c.id}`; if (S.autoLog[key]) return false;
  const text = a.text.replace(/\{name\}/g, first(c.name)).replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
  S.messages.push({ id: uid(), clientId: c.id, from: 'coach', text, ts: Date.now(), read: false, auto: id }); S.autoLog[key] = today(); return true;
}
function runAutomations() {
  let n = 0; const wk = mondayOf(today());
  DB.active().forEach(c => {
    const la = lastActive(c.id);
    if (la && daysBetween(la, today()) >= 4 && daysBetween(c.start, today()) > 4) n += autoSend(c, 'quiet', {}, `quiet:${c.id}:${wk}`);
    if (checkinDue(c.id) && daysBetween(c.start, today()) >= 6) n += autoSend(c, 'checkin', {}, `checkin:${c.id}:${wk}`);

}

/* ---------- small visuals ---------- */
function ring(pct, size, stroke, inner, color = 'var(--orange)') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#202024" stroke-width="${stroke}"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}"/></svg><div class="mid">${inner}</div></div>`;
}
function macroRings(t, tg) {
  const over = t.kcal > tg.kcal * 1.05, left = tg.kcal - t.kcal;
  const mini = (l, v, g) => `<div class="mini">${ring(v / g, 62, 6, `<b class="num" style="font-size:14px">${v}</b>`, v >= g * 0.95 ? 'var(--good)' : 'var(--orange)')}<span class="tiny">${l} <span class="num">/ ${g}g</span></span></div>`;
  return `<div class="rings">${ring(t.kcal / tg.kcal, 128, 11, `<b class="num" style="font-size:26px">${Math.abs(left)}</b><span>kcal ${left >= 0 ? 'left' : 'over'}</span>`, over ? 'var(--warn)' : 'var(--orange)')}
    <div class="minis">${mini('Protein', t.p, tg.p)}${mini('Carbs', t.c, tg.c)}${mini('Fat', t.f, tg.f)}</div></div>`;
}
function spark(vals, color = '#EE7A34') {
  if (vals.length < 2) return '<span class="spark"></span>';
  const lo = Math.min(...vals), hi = Math.max(...vals), X = i => 2 + i / (vals.length - 1) * 68, Y = v => 3 + (hi - v) / (hi - lo || 1) * 20;
  return `<svg class="spark" viewBox="0 0 72 26" aria-hidden="true"><path d="${vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join('')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(vals.length - 1)}" cy="${Y(vals[vals.length - 1]).toFixed(1)}" r="2.6" fill="${color}"/></svg>`;
}
function barChart(items, max = 100, unit = '%') {   // items: [{l, v}]
  return `<div class="stack-sm">${items.map(i => `<div class="row nowrap small"><span style="width:92px;flex:none" class="trunc">${esc(i.l)}</span><div class="bar grow ${i.v >= 80 ? 'good' : ''}"><i style="width:${Math.min(100, i.v / max * 100)}%"></i></div><b class="num" style="width:44px;text-align:right">${i.v}${unit}</b></div>`).join('')}</div>`;
}

/* ---------- line chart with touch/hover read-out ---------- */
const CH = {};
function lineChart(id, o) {
  const W = 520, H = o.h || 250, pl = 46, pr = 14, pt = 16, pb = 30, ser = o.series.filter(s => s.pts.length);
  const all = ser.flatMap(s => s.pts); if (all.length < 2) return `<div class="empty small">${o.empty || 'Log a few entries and the chart appears here.'}</div>`;
  let lo = Math.min(...all.map(p => p.y)), hi = Math.max(...all.map(p => p.y)); if (o.goal != null) { lo = Math.min(lo, o.goal); hi = Math.max(hi, o.goal); }
  const pad = (hi - lo) * 0.14 || 1; lo -= pad; hi += pad;
  const x0 = Math.min(...all.map(p => +D(p.x))), x1 = Math.max(...all.map(p => +D(p.x)));
  const X = x => pl + (+D(x) - x0) / Math.max(1, x1 - x0) * (W - pl - pr), Y = y => pt + (hi - y) / (hi - lo) * (H - pt - pb), f = o.fmt || (v => v.toFixed(1));
  const ticks = Array.from({ length: 5 }, (_, i) => lo + (hi - lo) * i / 4), nx = 4, xt = Array.from({ length: nx }, (_, i) => iso(new Date(x0 + (x1 - x0) * i / (nx - 1))));
  const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join('');
  const prim = ser.find(s => s.hover) || ser[0];
  CH[id] = { W, H, pt, pb, pts: prim.pts.map(p => ({ px: X(p.x), py: Y(p.y), label: o.tip ? o.tip(p) : `${fmt(p.x)} · ${f(p.y)}` })) };
  const lastP = prim.pts[prim.pts.length - 1];
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" data-ch="${id}" role="img" aria-label="${esc(o.label || 'Chart')}">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="#202024"/><text x="${pl - 8}" y="${(Y(t) + 4).toFixed(1)}" fill="#6F6C67" font-size="12" text-anchor="end" font-family="DM Sans, sans-serif">${f(t)}</text>`).join('')}
    ${xt.map((d, i) => `<text x="${X(d).toFixed(1)}" y="${H - 8}" fill="#6F6C67" font-size="12" text-anchor="${i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle'}" font-family="DM Sans, sans-serif">${fmt(d)}</text>`).join('')}
    ${ser.filter(s => s.area).map(s => `<path d="${path(s.pts)}L${X(s.pts[s.pts.length - 1].x).toFixed(1)} ${H - pb}L${X(s.pts[0].x).toFixed(1)} ${H - pb}Z" fill="#22150D"/>`).join('')}
    ${o.goal != null ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(o.goal).toFixed(1)}" y2="${Y(o.goal).toFixed(1)}" stroke="#5CC37E" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W - pr}" y="${(Y(o.goal) - 6).toFixed(1)}" fill="#5CC37E" font-size="12" font-weight="700" text-anchor="end" font-family="DM Sans, sans-serif">Goal ${f(o.goal)}</text>` : ''}
    ${ser.map(s => s.dots ? s.pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${s.r || 2.4}" fill="${s.color}"/>`).join('') : `<path d="${path(s.pts)}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2.5}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="4 5"' : ''}/>`).join('')}
    <circle cx="${X(lastP.x).toFixed(1)}" cy="${Y(lastP.y).toFixed(1)}" r="5.5" fill="#EE7A34" stroke="#0B0B0C" stroke-width="2.5"/>
    <g class="hov" visibility="hidden"><line y1="${pt}" y2="${H - pb}" stroke="#F6F3EE" stroke-width="1" stroke-dasharray="3 4"/><circle r="6" fill="#F6F3EE" stroke="#0B0B0C" stroke-width="2.5"/><rect height="26" rx="8" fill="#F6F3EE"/><text fill="#0B0B0C" font-size="12.5" font-weight="700" text-anchor="middle" font-family="DM Sans, sans-serif"></text></g>
    <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="#000" fill-opacity="0"/>
  </svg></div>`;
}
function chartHover(svg, clientX) {
  const c = CH[svg.dataset.ch]; if (!c) return; const r = svg.getBoundingClientRect(), vx = (clientX - r.left) / r.width * c.W;
  const p = c.pts.reduce((a, b) => Math.abs(b.px - vx) < Math.abs(a.px - vx) ? b : a), g = svg.querySelector('.hov'); if (!g) return;
  const [ln, dot, box, tx] = g.children, w = p.label.length * 6.9 + 20, bx = Math.max(4, Math.min(c.W - w - 4, p.px - w / 2)), by = Math.max(2, p.py - 42);
  ln.setAttribute('x1', p.px); ln.setAttribute('x2', p.px); dot.setAttribute('cx', p.px); dot.setAttribute('cy', p.py);
  box.setAttribute('x', bx); box.setAttribute('y', by); box.setAttribute('width', w); tx.setAttribute('x', bx + w / 2); tx.setAttribute('y', by + 17.5); tx.textContent = p.label; g.setAttribute('visibility', 'visible');
}
document.addEventListener('pointermove', e => { const s = e.target.closest?.('svg[data-ch]'); if (s) chartHover(s, e.clientX); });
document.addEventListener('pointerdown', e => { const s = e.target.closest?.('svg[data-ch]'); if (s) chartHover(s, e.clientX); });
document.addEventListener('pointerout', e => { const s = e.target.closest?.('svg[data-ch]'); if (s && e.pointerType === 'mouse' && !s.contains(e.relatedTarget)) s.querySelector('.hov')?.setAttribute('visibility', 'hidden'); });

  const rawBy = Object.fromEntries(w.raw.map(p => [p.x, p.y]));
  const toward = c.goalWeight ? Math.sign(c.goalWeight - w.cur) === Math.sign(w.rate) && Math.abs(w.rate) > 0.02 : null;

/* ---------- rest timer ---------- */
let timer = null, live = null;
function timerHTML() { if (!timer) return ''; const left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000)); return `<div class="timerbar" id="timerbar"><span>Rest</span><span class="t" id="timert">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span><button data-act="timerAdd">+30s</button><button data-act="timerStop">Skip</button></div>`; }
function startTimer(sec) {
  timer = { end: Date.now() + sec * 1000 }; clearInterval(startTimer._i);
  startTimer._i = setInterval(() => { if (!timer) return clearInterval(startTimer._i); const el = $('#timert'), left = Math.max(0, Math.ceil((timer.end - Date.now()) / 1000));
    if (el) el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (left <= 0) { timer = null; clearInterval(startTimer._i); $('#timerbar')?.remove(); try { navigator.vibrate?.(300); } catch (e) {} toast('Rest done. Next set.'); } }, 500);
}

  const set = VIEWS[ses.role], home = ses.role === 'coach' ? 'dash' : 'today';

function twoTap(el, label, fn) { if (el.dataset.armed) return fn(); const old = el.innerHTML; el.dataset.armed = 1; el.innerHTML = label; setTimeout(() => { if (el.isConnected) { el.innerHTML = old; delete el.dataset.armed; } }, 3000); }

function readImage(file, max, type, cb) { const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); cb(cv.toDataURL(type, 0.76)); }; img.onerror = () => toast('That image couldn\'t be read. Try a JPG or PNG.'); img.src = r.result; }; r.readAsDataURL(file); }

/* =====================================================================
   CHARTS: columns
   ===================================================================== */
function colChart(id, pts, o = {}) {
  const W = 520, H = o.h || 190, pl = 46, pr = 10, pt = 16, pb = 26; if (!pts.some(p => p.y)) return `<div class="empty small">${o.empty || 'Nothing logged in this period yet.'}</div>`;
  const hi = Math.max(...pts.map(p => p.y || 0), o.target || 0) * 1.14, bw = (W - pl - pr) / pts.length, Y = v => pt + (hi - v) / hi * (H - pt - pb), f = o.fmt || (v => Math.round(v).toLocaleString('en-GB'));
  CH[id] = { W, pts: pts.map((p, i) => ({ px: pl + bw * i + bw / 2, py: Y(p.y || 0), label: `${fmtLong(p.x)} · ${p.y ? f(p.y) + (o.unit || '') : 'not logged'}` })) };
  const lab = [0, Math.floor(pts.length / 2), pts.length - 1];
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" data-ch="${id}" role="img" aria-label="${esc(o.label || 'Chart')}">
    ${[0, 0.5, 1].map(k => `<line x1="${pl}" x2="${W - pr}" y1="${Y(hi * k / 1.14).toFixed(1)}" y2="${Y(hi * k / 1.14).toFixed(1)}" stroke="#202024"/><text x="${pl - 8}" y="${(Y(hi * k / 1.14) + 4).toFixed(1)}" fill="#6F6C67" font-size="12" text-anchor="end" font-family="DM Sans, sans-serif">${f(hi * k / 1.14)}</text>`).join('')}
    ${pts.map((p, i) => p.y ? `<rect x="${(pl + bw * i + bw * 0.2).toFixed(1)}" y="${Y(p.y).toFixed(1)}" width="${(bw * 0.6).toFixed(1)}" height="${Math.max(1, H - pb - Y(p.y)).toFixed(1)}" rx="3" fill="${o.hit && o.hit(p.y) ? '#5CC37E' : '#EE7A34'}"/>` : `<rect x="${(pl + bw * i + bw * 0.2).toFixed(1)}" y="${H - pb - 3}" width="${(bw * 0.6).toFixed(1)}" height="3" rx="1.5" fill="#34343A"/>`).join('')}
    ${o.target ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(o.target).toFixed(1)}" y2="${Y(o.target).toFixed(1)}" stroke="#F6F3EE" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W - pr}" y="${(Y(o.target) - 6).toFixed(1)}" fill="#F6F3EE" font-size="12" font-weight="700" text-anchor="end" font-family="DM Sans, sans-serif">Target ${f(o.target)}</text>` : ''}
    ${lab.map((i, k) => `<text x="${(pl + bw * i + bw / 2).toFixed(1)}" y="${H - 7}" fill="#6F6C67" font-size="12" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}" font-family="DM Sans, sans-serif">${fmt(pts[i].x)}</text>`).join('')}
    <g class="hov" visibility="hidden"><line y1="${pt}" y2="${H - pb}" stroke="#F6F3EE" stroke-width="1" stroke-dasharray="3 4"/><circle r="5" fill="#F6F3EE" stroke="#0B0B0C" stroke-width="2.5"/><rect height="26" rx="8" fill="#F6F3EE"/><text fill="#0B0B0C" font-size="12.5" font-weight="700" text-anchor="middle" font-family="DM Sans, sans-serif"></text></g>
    <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="#000" fill-opacity="0"/></svg></div>`;
}

/* =====================================================================
   DAILY TARGETS + WEEKLY RECAP (easy tracking)
   ===================================================================== */
function dayScore(c, date = today()) {
  const d = DB.day(c.id, date) || { habits: [], water: 0 }, tot = dayTotals(c.id, date), tg = targetsFor(c, date), plan = todaysPlan(c, date), logged = S.logs.some(l => l.clientId === c.id && l.date === date);
  const it = [{ l: 'Weigh-in', ic: 'scale', done: !!d.weight, act: 'sheetWeight' }, { l: plan.rest && !logged ? 'Rest day' : 'Session', ic: 'train', done: logged || (plan.rest && !plan.day), go: 'train' },
    { l: 'Food logged', ic: 'fuel', done: tot.n > 0, act: 'sheetFood' }, { l: `Protein ${tg.p}g`, ic: 'bolt', done: tot.p >= tg.p * 0.9, go: 'fuel' }, { l: `Water ${(S.settings.waterTarget / 1000).toFixed(1)}L`, ic: 'drop', done: (d.water || 0) >= S.settings.waterTarget, act: 'water', v: 250 }];
  if (habitsOn(c, today()).length) it.push({ l: 'Habits', ic: 'tick', done: habitsOn(c, today()).every(h => d.habits.includes(h.id)), go: 'today' });
  if (c.targets.steps) it.push({ l: `${(c.targets.steps / 1000)}k steps`, ic: 'foot', done: (d.steps || 0) >= c.targets.steps, act: 'sheetDaily' });
  return { it, done: it.filter(x => x.done).length, n: it.length };
}
function targetsCard(c) {
  const s = dayScore(c);
  return `<section class="card"><div class="row between nowrap"><div class="head" style="gap:3px"><h3>Today's targets</h3><span class="small sub">${s.done === s.n ? 'Every box ticked. That\'s the standard.' : `${s.n - s.done} to go. Tap one to log it.`}</span></div>${ring(s.done / s.n, 64, 7, `<b class="num" style="font-size:16px">${s.done}/${s.n}</b>`, s.done === s.n ? 'var(--good)' : 'var(--orange)')}</div>
    <div class="chks">${s.it.map(x => `<button class="chk ${x.done ? 'on' : ''}" ${x.act ? `data-act="${x.act}"${x.v ? ` data-v="${x.v}"` : ''}` : `data-go="${x.go}"`}>${x.done ? IC.tick : IC[x.ic]}<span>${x.l}</span></button>`).join('')}</div></section>`;
}
function weekStats(c, from, to) {
  const days = []; for (let d = from; d <= to; d = addDays(d, 1)) days.push(d);
  const tots = days.map(d => dayTotals(c.id, d)).filter(t => t.n), dl = days.map(d => DB.day(c.id, d)).filter(Boolean), ws = dl.filter(d => d.weight), st = dl.filter(d => d.steps);
  return { sessions: S.logs.filter(l => l.clientId === c.id && l.date >= from && l.date <= to).length, kcal: tots.length ? sum(tots, t => t.kcal) / tots.length : null, p: tots.length ? sum(tots, t => t.p) / tots.length : null, steps: st.length ? sum(st, d => d.steps) / st.length : null, w: ws.length ? sum(ws, d => d.weight) / ws.length : null };
}
function recapCard(c) {
  const m = mondayOf(today()), a = weekStats(c, m, today()), b = weekStats(c, addDays(m, -7), addDays(m, -1)), u = c.units;
  const t = (l, v, pv, f, goodDown = false) => { const d = v != null && pv != null ? v - pv : null; return `<div class="tile"><span class="lbl">${l}</span><span class="big num" style="font-size:22px;color:var(--text)">${v == null ? '—' : f(v)}</span><span class="tiny num" style="color:${d == null || Math.abs(d) < 0.05 ? 'var(--faint)' : (d < 0) === goodDown ? 'var(--good)' : 'var(--orange)'}">${d == null ? 'no data last week' : (d > 0 ? '+' : '') + f(d) + ' vs last week'}</span></div>`; };
  return `<section class="card stripe"><div class="row between"><h3>This week so far</h3><span class="tiny">since ${fmtLong(m)}</span></div><div class="tiles">
    ${t('Sessions', a.sessions, b.sessions, v => String(Math.round(v)))}${t(`Avg weight (${u})`, a.w, b.w, v => kgTo(v, u), c.goal !== 'bulk')}${t('Avg calories', a.kcal, b.kcal, v => Math.round(v).toLocaleString('en-GB'), c.goal === 'cut')}${t('Avg protein', a.p, b.p, v => Math.round(v) + 'g')}${t('Avg steps', a.steps, b.steps, v => Math.round(v).toLocaleString('en-GB'))}</div></section>`;
}
function trendsPanel(c) {

  const head = o.head || { label: 'Daily average', value: f(avg), unit: u, sub: `${fmt(a)} – ${fmt(b, { day: 'numeric', month: 'short', year: 'numeric' })}` };

    ${sc.ticks.map((t, i) => `<line x1="${pl}" x2="${W - pr}" y1="${q(Y(t))}" y2="${q(Y(t))}" stroke="${i ? '#1F1F23' : '#34343A'}"/><text x="${W - pr + 8}" y="${q(Y(t) + 4)}" fill="#6F6C67" font-size="12" ${CF}>${sc.f(t)}</text>`).join('')}

/* ---------- range switch shared by every tracking chart ---------- */
const RANGES = [[7, '7D'], [30, '30D'], [90, '90D'], [0, 'All']];

/* ---------- bodyweight: time-aware trend + rate from the raw weigh-ins ---------- */
function weightData(c, days = 0) {
  const all = DB.dailyOf(c.id).filter(d => d.weight).map(d => ({ x: d.date, y: d.weight }));
  // trend: each weigh-in pulls the line 22% of the way per day since the last one, so gaps don't leave it stale
  let t = null, px = null; const trend = all.map(p => { if (t == null) t = p.y; else t += (1 - Math.pow(0.78, Math.max(1, daysBetween(px, p.x)))) * (p.y - t); px = p.x; return { x: p.x, y: t }; });
  const since = days ? addDays(today(), -days) : '0', raw = all.filter(p => p.x >= since), tr = trend.filter(p => p.x >= since);
  if (tr.length < 2) return { raw, trend: tr, n: raw.length, total: all.length };
  const cur = tr[tr.length - 1].y, startY = tr[0].y;
  // rate: straight-line fit through the last 28 days of actual weigh-ins (falls back to the trend if there are too few)
  const slope = ps => { const xs = ps.map(p => daysBetween(ps[0].x, p.x)), mx = sum(xs) / xs.length, my = sum(ps, p => p.y) / ps.length, den = sum(xs, x => (x - mx) ** 2); return den ? sum(xs.map((x, i) => (x - mx) * (ps[i].y - my))) / den * 7 : 0; };
  const r28 = all.filter(p => p.x >= addDays(today(), -28)), rT = trend.filter(p => p.x >= addDays(today(), -28));
  const rate = r28.length >= 6 && daysBetween(r28[0].x, r28[r28.length - 1].x) >= 12 ? slope(r28) : rT.length > 2 ? slope(rT) : 0;
  let eta = null; const g = c.goalWeight;
  if (g && Math.abs(rate) > 0.02 && Math.sign(g - cur) === Math.sign(rate)) { const d = Math.round((g - cur) / rate * 7); if (d > 0 && d < 730) eta = addDays(today(), d); }
  const wk = {}; all.forEach(p => { const m = mondayOf(p.x); (wk[m] = wk[m] || []).push(p.y); });
  const weeks = Object.entries(wk).sort().map(([m, v]) => ({ week: m, avg: sum(v) / v.length, n: v.length })), first0 = all[0].y;
  return { raw, trend: tr, n: raw.length, total: all.length, cur, change: cur - startY, totalChange: cur - first0, rate, eta, lo: Math.min(...raw.map(p => p.y)), hi: Math.max(...raw.map(p => p.y)), weeks, toGoal: g ? g - cur : null, startAll: first0 };
}
function weightPanel(c, coach) {
  const range = curRange(), u = c.units, w = weightData(c, range), f = v => kgTo(v, u), logBtn = coach ? '' : `<button class="btn sm" data-act="sheetWeight">${IC.plus} Log weight</button>`;
  if ((w.total || 0) < 2) return `<section class="card"><h3>Bodyweight</h3><div class="empty small">Log your weight a few mornings in a row and the trend builds here.${logBtn}</div></section>`;
  if (w.n < 2) return `<section class="card"><div class="row between"><h3>Bodyweight</h3>${logBtn}</div>${rangeSeg()}<div class="empty small">Fewer than two weigh-ins in the ${rangeWord()} shown. Pick a longer range or log today's weight.</div></section>`;
  const rawBy = Object.fromEntries(w.raw.map(p => [p.x, p.y])), goalU = c.goalWeight ? +f(c.goalWeight) : null;
  const toward = c.goalWeight ? Math.sign(c.goalWeight - w.cur) === Math.sign(w.rate) && Math.abs(w.rate) > 0.02 : null;

    ${lineChart('w' + c.id, { label: 'Bodyweight trend', title: 'Bodyweight', h: 290, unit: ' ' + u, goal: goalU, minmax: true, hoverLabel: 'Trend weight', headRight: logBtn,
      head: { label: 'Trend weight', value: f(w.cur), unit: ' ' + u, alt: { label: `Last logged · ${fmt(w.raw[w.raw.length - 1].x)}`, value: f(w.raw[w.raw.length - 1].y), unit: ' ' + u }, sub: `${sg(w.change)} ${u} · ${rangeWord()} · ${w.n} weigh-ins` },
      series: [{ pts: w.raw.map(p => ({ x: p.x, y: +f(p.y) })), color: '#D9D4CB', raw: true }, { pts: w.trend.map(p => ({ x: p.x, y: +f(p.y), note: rawBy[p.x] ? `you logged ${f(rawBy[p.x])} ${u}` : '' })), color: '#EE7A34', w: 3.2, area: true, hover: true }] })}
    <div class="row between">${rangeSeg()}<div class="legend"><span><i style="background:#EE7A34"></i>Trend</span><span><i style="background:#D9D4CB"></i>Weight you logged</span>${goalU ? '<span><i style="background:#5CC37E"></i>Goal</span>' : ''}</div></div>

    </tbody></table></div></section>`;
}

  if (!last) return true; if (f.freq === 'once') return false; if (f.freq === 'daily') return last < t; if (f.freq === 'weekly') return last < mondayOf(t); if (f.freq === 'fortnightly') return daysBetween(last, t) >= 14; return last.slice(0, 7) < t.slice(0, 7);
}

function billing(c) {
  const pl = DB.plan(c), total = c.price != null && c.price !== '' ? +c.price : pl.price + (c.addon ? (pl.addon || 0) : 0);
  const n = c.billing === 'Monthly' ? pl.months : c.billing === 'Weekly' ? Math.round(pl.months * 52 / 12) : 1, each = total / n;
  const pays = S.payments.filter(p => p.clientId === c.id && p.date >= (c.payFrom || '')).sort((a, b) => a.date.localeCompare(b.date)), paid = sum(pays, p => p.amount);   // after a renewal, only payments for the new plan count
  const k = Math.min(n, Math.floor(paid / each + 0.01));
  const nextDue = paid >= total - 0.5 ? null : c.billing === 'Monthly' ? addMonths(c.start, k) : c.billing === 'Weekly' ? addDays(c.start, k * 7) : c.start;
  const overdue = !!nextDue && nextDue < today() && c.status === 'active';
  return { total, each, n, paid, left: Math.max(0, total - paid), nextDue, overdue, pays, monthly: c.billing === 'Monthly' ? each : c.billing === 'Weekly' ? each * 52 / 12 : 0 };
}
function status(c) {
  if (c.status !== 'active') return { k: 'mute', t: c.status === 'paused' ? 'Paused' : c.status === 'inactive' ? 'Deactivated' : 'Finished' };
  const la = lastActive(c.id), q = la ? daysBetween(la, today()) : 99;
  if (q >= 4) return { k: 'bad', t: 'Quiet ' + (la ? q + 'd' : '') };
  if (S.checkins.some(k => k.clientId === c.id && !k.reviewed)) return { k: 'warn', t: 'Check-in to review' };
  return { k: 'good', t: 'On track' };
}

const curView = db => db.db.views.find(v => v.id === db.db.cur) || db.db.views[0];
const optOf = (pr, v) => (pr.opts || []).find(o => o.v === v);
const pill = (pr, v) => { const o = optOf(pr, v); return v ? `<span class="opt" style="background:${OPT_C[o ? o.c : 0]};color:${OPT_T[o ? o.c : 0]}">${esc(v)}</span>` : ''; };
function cellText(pr, r) { const v = pr.type === 'title' ? r.title : r.props[pr.id]; if (v == null || v === '') return ''; if (pr.type === 'select' || pr.type === 'status') return pill(pr, v); if (pr.type === 'date') return esc(fmt(v)); if (pr.type === 'check') return v ? IC.tick : ''; if (pr.type === 'client') return esc(DB.client(v)?.name || ''); if (pr.type === 'url') return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(String(v).replace(/^https?:\/\/(www\.)?/, '').slice(0, 30))}</a>`; return esc(v); }
function cellHTML(db, r, pr, ed, where = 'cell') {
  if (!ed) return `<span class="cellro">${cellText(pr, r) || '<span class="tiny">—</span>'}</span>`;
  const v = pr.type === 'title' ? r.title : r.props[pr.id] ?? '', k = `data-cell="${r.id}|${pr.id}"`;
  switch (pr.type) {
    case 'title': return `<div class="row nowrap" style="gap:4px"><input class="cin tin" ${k} value="${esc(v)}" placeholder="Untitled"><button class="iconbtn sm" data-go="page" data-p="${P({ id: r.id, _back: 'page', _backP: { id: db.id } })}" aria-label="Open">${IC.fwd}</button></div>`;
    case 'number': return `<input class="cin num" type="number" step="any" ${k} value="${esc(v)}">`;
    case 'date': return `<input class="cin" type="date" ${k} value="${esc(v)}">`;
    case 'check': return `<input type="checkbox" ${k} ${v ? 'checked' : ''} aria-label="${esc(pr.name)}">`;
    case 'select': case 'status': return `<select class="cin csel" ${k} ${v ? `style="background:${OPT_C[optOf(pr, v)?.c || 0]};color:${OPT_T[optOf(pr, v)?.c || 0]}"` : ''}><option value="">—</option>${(pr.opts || []).map(o => `<option ${o.v === v ? 'selected' : ''}>${esc(o.v)}</option>`).join('')}</select>`;

}
function viewRows(db, v) {

  if (q) rows = rows.filter(r => (r.title + ' ' + Object.values(r.props).join(' ')).toLowerCase().includes(q));
  if (v.filter && v.filter.p) { const pr = db.db.props.find(x => x.id === v.filter.p); if (pr) rows = rows.filter(r => pr.type === 'check' ? !!r.props[pr.id] === (v.filter.v === 'yes') : (r.props[pr.id] || '') === v.filter.v); }
  if (v.sort && v.sort.p) { const pr = db.db.props.find(x => x.id === v.sort.p), get = r => pr.type === 'title' ? r.title : r.props[pr.id] ?? ''; rows.sort((a, b) => { const x = get(a), y = get(b), c = pr.type === 'number' ? (+x || 0) - (+y || 0) : (pr.type === 'select' || pr.type === 'status') ? (pr.opts.findIndex(o => o.v === x) - pr.opts.findIndex(o => o.v === y)) : String(x).localeCompare(String(y)); return v.sort.dir === 'desc' ? -c : c; }); }

}

function dupPage(p, parent, rowOf) { const n = { ...JSON.parse(JSON.stringify(p)), id: uid(), parent, rowOf: rowOf || null, ts: Date.now(), edited: Date.now(), fav: false, tpl: false, share: [] }; n.blocks = (n.blocks || []).map(b => ({ ...b, id: uid() })); S.pages.push(n);
  const map = {}; S.pages.filter(k => k.parent === p.id && !k.rowOf && !k.trashed).forEach(k => { map[k.id] = dupPage(k, n.id).id; }); n.blocks.forEach(b => { if (b.t === 'page' && map[b.pid]) b.pid = map[b.pid]; });
  if (p.kind === 'db') rowsOf(p).forEach(r => dupPage(r, null, n.id)); return n; }
function purge(id) { S.pages.filter(x => x.parent === id || x.rowOf === id).forEach(x => purge(x.id)); const p = pgById(id); (p?.blocks || []).forEach(b => b.img && idb.del(b.img)); S.pages = S.pages.filter(x => x.id !== id); }

  return `<section class="card stripe"><div class="row between"><div class="head" style="gap:3px"><h3>To-do list</h3><span class="small sub">Today: ${done} of ${it.length} done. Workouts, habits and check-ins are added automatically.</span></div><button class="btn sm" data-act="sheetTask" data-c="${c.id}">${IC.plus} Add task</button></div>
    <div class="list">${tasks.map(t => { const on = taskOn(t, today()), d = taskDone(t, today()); return `<div class="li"><span class="tick ${d ? 'on' : ''}" aria-hidden="true">${d ? IC.tick : ''}</span><span class="grow" style="min-width:0"><b class="trunc" style="display:block">${esc(t.title)}</b><span class="tiny">${esc(repeatText(t))}${t.repeat === 'once' && t.done.once ? ' · done ' + fmt(t.done.once) : on ? (d ? ' · done today' : ' · not done yet today') : ' · not on today'}${t.link ? ' · opens ' + esc((TASK_LINKS.find(l => l[0] === t.link) || [, ''])[1].split(' (')[0]) : ''}</span></span><button class="iconbtn sm" data-act="sheetTask" data-c="${c.id}" data-id="${t.id}" aria-label="Edit ${esc(t.title)}">${IC.edit}</button></div>`; }).join('') || '<span class="tiny">No tasks yet. Add things like progress photos, meal prep or watching a module.</span>'}</div></section>`;
}
{ const _co = clientOverview; clientOverview = function (c, ...a) { return coachTodoCard(c) + _co(c, ...a); }; }

SHEETS.task = el => { const c = DB.client(el.dataset.c), t = S.tasks.find(x => x.id === el.dataset.id) || { title: '', note: '', link: '', repeat: 'once', days: [1, 2, 3, 4, 5], due: '' };
  const rep = t.repeat === 'once' ? 'once' : t.days.length === 7 ? 'daily' : t.days.join() === '1,2,3,4,5' ? 'weekdays' : 'days';
  openSheet(`${sheetHead(c.name, t.id ? 'Edit task' : 'New task')}
    ${t.id ? '' : `<div class="eyebrow">Quick picks</div><div class="tabs wrap">${TASK_PRESETS.map(([n, l, r]) => `<button class="tab" data-act="taskPreset" data-n="${esc(n)}" data-l="${l}" data-r="${r}">${esc(n)}</button>`).join('')}</div>`}
    <form class="stack-sm" data-form="task" data-c="${c.id}" data-id="${t.id || ''}">
      <label class="f">Task<input class="in" name="title" id="tasktitle" required maxlength="80" value="${esc(t.title)}" placeholder="e.g. Take your progress photos"></label>
      <label class="f">Note (optional)<input class="in" name="note" maxlength="120" value="${esc(t.note)}" placeholder="e.g. Front, side, back in the same light"></label>
      <div class="eyebrow">How often</div>
      <div class="seg repseg">${[['once', 'Once'], ['daily', 'Every day'], ['weekdays', 'Weekdays'], ['days', 'Pick days']].map(([k, l]) => `<label class="segopt"><input type="radio" name="rep" value="${k}" ${rep === k ? 'checked' : ''} data-taskrep><span>${l}</span></label>`).join('')}</div>
      <div id="taskdays" ${rep === 'days' ? '' : 'hidden'}><div class="row" style="gap:6px">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label class="segopt dayopt"><input type="checkbox" name="d${d}" ${t.days.includes(d) ? 'checked' : ''}><span>${DAYN[d]}</span></label>`).join('')}</div></div>

      ${t.id ? '' : `<div class="eyebrow">Also give it to</div><div class="stack-sm">${DB.active().filter(x => x.id !== c.id).map(x => `<label class="row small" style="gap:8px"><input type="checkbox" name="c_${x.id}"> ${esc(x.name)}</label>`).join('') || '<span class="tiny">No other active clients.</span>'}</div>`}
      <button class="btn block" type="submit">${t.id ? 'Save task' : 'Add to their to-do list'}</button></form>
    ${t.id ? `<button class="btn danger" data-act="taskDel" data-id="${t.id}">Delete task</button>` : ''}`); };

    if (el.dataset.r === 'weekly') document.querySelectorAll('#taskdays input').forEach(x => { x.checked = x.name === 'd0'; }); },
  taskTick: el => { const t = S.tasks.find(x => x.id === el.dataset.id), k = taskKey(t, today()), c = me(); if (t.done[k]) delete t.done[k]; else { t.done[k] = today(); toast('Ticked off'); } save(); stay({}); },
  taskDel: el => twoTap(el, 'Tap again to delete', () => { S.tasks = S.tasks.filter(x => x.id !== el.dataset.id); save(); closeSheet(); toast('Task deleted'); stay({}); })

FORMS.task = (f, d) => {
  const days = d.rep === 'daily' ? [0, 1, 2, 3, 4, 5, 6] : d.rep === 'weekdays' ? [1, 2, 3, 4, 5] : d.rep === 'days' ? [0, 1, 2, 3, 4, 5, 6].filter(x => d['d' + x]) : [];
  if (d.rep === 'days' && !days.length) return toast('Pick at least one day.');
  const base = { title: d.title.trim(), note: (d.note || '').trim(), link: d.link || '', repeat: d.rep === 'once' ? 'once' : 'days', days, due: d.rep === 'once' ? (d.due || '') : '' };
  const ex = S.tasks.find(x => x.id === f.dataset.id);
  if (ex) Object.assign(ex, base);
  else { const ids = [f.dataset.c, ...DB.active().filter(x => d['c_' + x.id]).map(x => x.id)]; ids.forEach(cid => S.tasks.push({ id: uid(), clientId: cid, ...base, done: {}, start: today(), ts: Date.now() })); }
  save(); closeSheet(); toast(ex ? 'Task saved' : 'Added to their to-do list'); stay({});
};
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.taskrep !== undefined && t.checked) { const dd = $('#taskdays'), du = $('#taskdue'); if (dd) dd.hidden = t.value !== 'days'; if (du) du.hidden = t.value !== 'once'; } });

/* =====================================================================
   09e (v5.5): habit schedules, starter packs, the full exercise
   library with demo videos.
   - Habits can run on chosen days (every day, weekdays, or picked days).
     Scores, points, targets and the to-do list only count a habit on
     its days.
   - Starter packs bundle a programme, habits (with days), tasks, a meal
     plan, a roadmap and a welcome message, applied to a client in one tap.
   - ~685 built-in exercises (EXLIB) merged into the library with stable
     ids. Each can have a demo: a link (YouTube, Instagram, Loom, Drive)
     or a video uploaded from the phone.
   ===================================================================== */

/* ---------- habit schedules ---------- */
const ALLD = [0, 1, 2, 3, 4, 5, 6], WKD = [1, 2, 3, 4, 5];
function habitsOn(c, date) { const w = dow(date); return (c.habits || []).filter(h => !h.days || h.days.includes(w)); }
function habitSlots(c, since, days) { let n = 0; for (let i = 0; i < days; i++) n += habitsOn(c, addDays(since, i)).length; return n; }
function habitDaysText(h) { const d = h.days; return !d || d.length === 7 ? 'Every day' : d.join() === '1,2,3,4,5' ? 'Weekdays' : d.join() === '0,6' ? 'Weekends' : [1, 2, 3, 4, 5, 6, 0].filter(x => d.includes(x)).map(x => DAYN[x]).join(', '); }
const dayChips = (sel, name = 'hd') => `<div class="row" style="gap:6px">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label class="segopt dayopt"><input type="checkbox" name="${name}${d}" ${sel.includes(d) ? 'checked' : ''}><span>${DAYN[d]}</span></label>`).join('')}</div>`;
const dayQuick = name => `<div class="row" style="gap:6px"><button type="button" class="tab" data-act="dayPick" data-n="${name}" data-v="all">Every day</button><button type="button" class="tab" data-act="dayPick" data-n="${name}" data-v="wkd">Weekdays</button><button type="button" class="tab" data-act="dayPick" data-n="${name}" data-v="wke">Weekends</button></div>`;
const readDays = (d, name = 'hd') => ALLD.filter(x => d[name + x]);
SHEETS.habitDays = el => { const c = DB.client(el.dataset.c), h = c.habits.find(x => x.id === el.dataset.h);
  openSheet(`${sheetHead(c.name, h.label)}<form class="stack-sm" data-form="habitDays" data-c="${c.id}" data-h="${h.id}"><label class="f">Habit<input class="in" name="label" value="${esc(h.label)}" required maxlength="60"></label><div class="eyebrow">Which days</div>${dayQuick('hd')}${dayChips(h.days || ALLD)}<button class="btn block" type="submit">Save</button></form>`); };
FORMS.habitDays = (f, d) => { const c = DB.client(f.dataset.c), h = c.habits.find(x => x.id === f.dataset.h), days = readDays(d); if (!days.length) return toast('Pick at least one day.'); h.label = d.label.trim(); h.days = days.length === 7 ? undefined : days; save(); closeSheet(); toast('Habit updated'); stay({}); };
let HAS_DAYS = ALLD.slice();
Object.assign(ACTS, {
  sheetHabitDays: el => SHEETS.habitDays(el),
  dayPick: el => { const v = el.dataset.v, set = v === 'all' ? ALLD : v === 'wkd' ? WKD : [0, 6]; ALLD.forEach(x => { const i = document.querySelector(`input[name="${el.dataset.n}${x}"]`); if (i) i.checked = set.includes(x); }); },
  sheetHabitAssign: el => { const n = el.dataset.n; openSheet(`${sheetHead('Assign habit', n)}<div class="eyebrow">On which days</div><div class="row" style="gap:6px">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button class="tab ${HAS_DAYS.includes(d) ? 'on' : ''}" data-act="hasDay" data-d="${d}" data-n="${esc(n)}">${DAYN[d]}</button>`).join('')}</div><span class="tiny">${esc(habitDaysText({ days: HAS_DAYS }))}. Tap a client to give it to them.</span>
    <div class="stack-sm">${DB.active().map(c => { const on = c.habits.some(h => h.label === n); return `<button class="check ${on ? 'on' : ''}" data-act="habitAssign" data-n="${esc(n)}" data-c="${c.id}"><span class="box">${on ? IC.tick : ''}</span><span class="grow">${esc(c.name)}</span><span class="tiny num">${on ? esc(habitDaysText(c.habits.find(h => h.label === n))) : c.habits.length + ' habits'}</span></button>`; }).join('')}</div>`); },
  hasDay: el => { const d = +el.dataset.d; HAS_DAYS = HAS_DAYS.includes(d) ? HAS_DAYS.filter(x => x !== d) : [...HAS_DAYS, d].sort(); if (!HAS_DAYS.length) HAS_DAYS = [d]; ACTS.sheetHabitAssign(el); },
  habitAssign: el => { const c = DB.client(el.dataset.c), n = el.dataset.n, i = c.habits.findIndex(h => h.label === n); if (i >= 0) c.habits.splice(i, 1); else c.habits.push({ id: uid(), label: n, days: HAS_DAYS.length === 7 ? undefined : HAS_DAYS.slice() }); save(); toast(i >= 0 ? `Removed from ${first(c.name)}` : `Assigned to ${first(c.name)}`); ACTS.sheetHabitAssign(el); }
});

/* ---------- starter packs ---------- */
function migrate5e() {
  S.packs = S.packs || [];
  S.exercises.forEach(e => { if (e.video && !e.url) e.url = e.video; delete e.video; });
  const have = new Map(S.exercises.map(e => [e.name.toLowerCase(), e]));
  EXLIB.forEach(([id, name, muscle, equip]) => { const ex = have.get(name.toLowerCase()); if (ex) { if (!ex.lib) { ex.muscle = muscle; ex.lib = 1; } } else S.exercises.push({ id, name, muscle, equip, url: '', cues: '', lib: 1 }); });
  if (S.settings.demo && !S.v5PackSeeded) { S.v5PackSeeded = true; const tpl = S.programmes.find(p => p.isTemplate);
    S.packs.push({ id: uid(), name: 'New starter: site-day cut (example)', desc: 'Everything a new lad on a fat-loss plan needs from day one.', programmeId: tpl ? tpl.id : '', mealPlanId: S.mealPlans[0] ? S.mealPlans[0].id : '', roadmap: true,
      habits: [{ label: '3L water' }, { label: 'Protein target hit' }, { label: '10,000 steps', days: [0, 6] }, { label: 'Prep tomorrow\'s lunch tonight', days: [0, 1, 2, 3, 4] }],
      tasks: [{ title: 'Fill in your onboarding form', link: '', repeat: 'once', days: [], dueIn: 1 }, { title: 'Take your starting photos', link: 'progress', repeat: 'once', days: [], dueIn: 2 }, { title: 'Take your progress photos', link: 'progress', repeat: 'days', days: [0], dueIn: 0 }],
      message: 'Welcome in, {name}. Your plan, habits and to-do list are all set up on your Today screen. Start with the onboarding form and your starting photos.', ts: Date.now() }); }
}
function applyPack(pk, c) {
  const did = [];
  if (pk.programmeId && DB.prog(pk.programmeId)) { c.programmeId = copyProg(pk.programmeId, c.id); did.push('programme'); }
  if (pk.mealPlanId && S.mealPlans.some(m => m.id === pk.mealPlanId)) { c.mealPlanId = pk.mealPlanId; did.push('meal plan'); }
  let nh = 0; (pk.habits || []).forEach(h => { if (!c.habits.some(x => x.label.toLowerCase() === h.label.toLowerCase())) { c.habits.push({ id: uid(), label: h.label, days: h.days && h.days.length < 7 ? h.days.slice() : undefined }); nh++; } }); if (nh) did.push(nh + ' habit' + (nh > 1 ? 's' : ''));
  (pk.tasks || []).forEach(t => S.tasks.push({ id: uid(), clientId: c.id, title: t.title, note: t.note || '', link: t.link || '', repeat: t.repeat, days: t.days || [], due: t.repeat === 'once' && t.dueIn ? addDays(today(), +t.dueIn) : '', done: {}, start: today(), ts: Date.now() })); if ((pk.tasks || []).length) did.push(pk.tasks.length + ' task' + (pk.tasks.length > 1 ? 's' : ''));
  if (pk.roadmap && !S.pages.some(p => !p.trashed && Array.isArray(p.share) && p.share.length === 1 && p.share[0] === c.id && /roadmap/i.test(p.title))) { tplRoadmap(c, null); did.push('roadmap'); }
  if (pk.message && pk.message.trim()) { S.messages.push({ id: uid(), clientId: c.id, from: 'coach', text: pk.message.replace(/\{name\}/g, first(c.name)), ts: Date.now(), read: false }); did.push('welcome message'); }
  (c.packs = c.packs || []).push({ id: pk.id, name: pk.name, date: today() });
  return did;
}
function packSummary(pk) { const pr = DB.prog(pk.programmeId), mp = S.mealPlans.find(m => m.id === pk.mealPlanId);
  return [pr && 'Programme: ' + pr.name, mp && 'Meal plan: ' + mp.name, (pk.habits || []).length && pk.habits.length + ' habits', (pk.tasks || []).length && pk.tasks.length + ' tasks', pk.roadmap && 'Roadmap', pk.message && 'Welcome message'].filter(Boolean).join(' · ') || 'Empty so far'; }

/* ---------- exercise library and demo videos ---------- */
// Uploaded demo videos live in their own browser store (they're big). Until the
// database is connected they're only on the device that uploaded them.
const vdb = {
  db: null, urls: {},
  open() { return this.db ? Promise.resolve(this.db) : new Promise(res => { try { const r = indexedDB.open('tt_videos', 1); r.onupgradeneeded = () => r.result.createObjectStore('v'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => res(null); } catch (e) { res(null); } }); },
  async put(id, blob) { const db = await this.open(); if (!db) throw new Error('nodb'); return new Promise((res, rej) => { const t = db.transaction('v', 'readwrite'); t.objectStore('v').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async url(id) { if (this.urls[id]) return this.urls[id]; const db = await this.open(); if (!db) return null; return new Promise(res => { const q = db.transaction('v').objectStore('v').get(id); q.onsuccess = () => { if (!q.result) return res(null); this.urls[id] = URL.createObjectURL(q.result); res(this.urls[id]); }; q.onerror = () => res(null); }); },
  async del(id) { const db = await this.open(); if (db) db.transaction('v', 'readwrite').objectStore('v').delete(id); if (this.urls[id]) { URL.revokeObjectURL(this.urls[id]); delete this.urls[id]; } }
};
function ytId(u) { const m = String(u || '').match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/); return m ? m[1] : null; }
